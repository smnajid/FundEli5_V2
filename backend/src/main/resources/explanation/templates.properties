# Plain-language wording for the Explanation under a Verdict (ADR 0002). Keys: <RULE_KIND>.<FAIL|REVIEW>.<lang>.
# Only Fail and Review rules get a sentence. The desk (Samuel) owns the wording; the Requester can forward it.
VERDICT.ELIGIBLE.en=The Verdict is Eligible: the portfolio may subscribe.
VERDICT.NOT_ELIGIBLE.en=The Verdict is Not Eligible: the portfolio may not subscribe.
VERDICT.NEEDS_REVIEW.en=The Verdict is Needs Review: the desk has to check before the portfolio can subscribe.
VERDICT.ELIGIBLE.fr=Le verdict est \u00c9ligible : le portefeuille peut souscrire.
VERDICT.NOT_ELIGIBLE.fr=Le verdict est Non \u00e9ligible : le portefeuille ne peut pas souscrire.
VERDICT.NEEDS_REVIEW.fr=Le verdict est \u00c0 examiner : le desk doit vérifier avant que le portefeuille puisse souscrire.
ALTERNATIVES.en=Classes this portfolio can buy instead: {classes}.
ALTERNATIVES.fr=Parts que ce portefeuille peut acheter à la place : {classes}.

INVESTOR_CATEGORY.FAIL.en=The deciding rule is the investor category: this class is only for investors of a category the portfolio does not belong to.
INVESTOR_CATEGORY.REVIEW.en=The investor category rule cannot be settled yet: the desk must confirm that the portfolio belongs to a category this class allows.
INVESTOR_CATEGORY.FAIL.fr=La règle décisive est la catégorie d'investisseur : cette part est réservée à une catégorie d'investisseurs dont le portefeuille ne fait pas partie.
INVESTOR_CATEGORY.REVIEW.fr=La règle de catégorie d'investisseur ne peut pas encore être tranchée : le desk doit confirmer que le portefeuille appartient à une catégorie admise.
US_PERSON_EXCLUSION.FAIL.en=The US Person rule applies: this class is closed to US Persons, and the client is one.
US_PERSON_EXCLUSION.REVIEW.en=The US Person rule cannot be settled yet: the desk must confirm that the client is not a US Person.
US_PERSON_EXCLUSION.FAIL.fr=La règle des US Persons s'applique : cette part est fermée aux US Persons, et le client en est une.
US_PERSON_EXCLUSION.REVIEW.fr=La règle des US Persons ne peut pas encore être tranchée : le desk doit confirmer que le client n'est pas une US Person.
MINIMUM_INITIAL_SUBSCRIPTION.FAIL.en=The minimum initial subscription is not reached: the amount is below what this class asks for a first purchase.
MINIMUM_INITIAL_SUBSCRIPTION.REVIEW.en=The minimum initial subscription cannot be settled yet: the amount or its currency needs a check by the desk.
MINIMUM_INITIAL_SUBSCRIPTION.FAIL.fr=Le minimum de souscription initiale n'est pas atteint : le montant est inférieur à ce que cette part demande pour un premier achat.
MINIMUM_INITIAL_SUBSCRIPTION.REVIEW.fr=Le minimum de souscription initiale ne peut pas encore être tranché : le montant ou sa devise doit être vérifié par le desk.
MANDATE_ONLY_CLASS.FAIL.en=This class is only for portfolios under a discretionary mandate, and this portfolio is not.
MANDATE_ONLY_CLASS.REVIEW.en=The mandate-only rule cannot be settled yet: the desk must confirm the portfolio's mandate.
MANDATE_ONLY_CLASS.FAIL.fr=Cette part est réservée aux portefeuilles sous mandat de gestion discrétionnaire, ce qui n'est pas le cas de ce portefeuille.
MANDATE_ONLY_CLASS.REVIEW.fr=La règle des parts réservées aux mandats ne peut pas encore être tranchée : le desk doit confirmer le mandat du portefeuille.
KID_REQUIRED_FOR_RETAIL.FAIL.en=A retail client needs the key information document (KID) for this class, and it is not available.
KID_REQUIRED_FOR_RETAIL.REVIEW.en=The KID rule cannot be settled yet: the desk must check that the retail client has the key information document.
KID_REQUIRED_FOR_RETAIL.FAIL.fr=Un client privé doit disposer du document d'informations clés (DIC) de cette part, et il n'est pas disponible.
KID_REQUIRED_FOR_RETAIL.REVIEW.fr=La règle du DIC ne peut pas encore être tranchée : le desk doit vérifier que le client privé dispose du document d'informations clés.
TARGET_MARKET.FAIL.en=The target market does not match: this class is meant for investors with another risk profile, horizon or experience.
TARGET_MARKET.REVIEW.en=The target market cannot be settled yet: the desk must check the risk profile, horizon and experience against what the class is meant for.
TARGET_MARKET.FAIL.fr=Le marché cible ne correspond pas : cette part est destinée à des investisseurs avec un autre profil de risque, horizon ou expérience.
TARGET_MARKET.REVIEW.fr=Le marché cible ne peut pas encore être tranché : le desk doit comparer le profil de risque, l'horizon et l'expérience à ceux visés par la part.
UNMODELLED_RESTRICTION.FAIL.en=The documents set a restriction the desk has judged to block this subscription.
UNMODELLED_RESTRICTION.REVIEW.en=The documents set a restriction the desk has not yet judged: it must be read before the portfolio can subscribe.
UNMODELLED_RESTRICTION.FAIL.fr=Les documents fixent une restriction que le desk a jugée bloquante pour cette souscription.
UNMODELLED_RESTRICTION.REVIEW.fr=Les documents fixent une restriction que le desk n'a pas encore jugée : elle doit être lue avant que le portefeuille puisse souscrire.
FUND_REGISTRATION.FAIL.en=The fund is not registered for sale where the client is based.
FUND_REGISTRATION.REVIEW.en=The fund's registration for the client's country cannot be confirmed: the desk must check it.
FUND_REGISTRATION.FAIL.fr=Le fonds n'est pas enregistré à la vente dans le pays du client.
FUND_REGISTRATION.REVIEW.fr=L'enregistrement du fonds dans le pays du client ne peut pas être confirmé : le desk doit le vérifier.
