spring.application.name=fundeli5

fundeli5.fixtures.dir=../docs/playbook/contracts/fixtures
fundeli5.documents.folder=../fund-documents
# replay | claude-plan (runs `claude -p`; optional fundeli5.llm.claude-plan.command/.schema/.timeout)
fundeli5.llm.endpoint=replay
fundeli5.llm.recordings=src/main/resources/llm-recordings
fundeli5.validation.drafts=${fundeli5.fixtures.dir}/draft-rule-cards,target/draft-rule-cards
fundeli5.pipeline.out=target/draft-rule-cards

# Privacy Gate personal-data detector (ADR 0009): presidio | fixture (tests only: it knows three names)
fundeli5.privacygate.detector=presidio
fundeli5.privacygate.presidio.url=http://localhost:5002
fundeli5.privacygate.presidio.languages=en

# Page selection in the Rule Card pipeline: TypeSafe Jev (key from the environment), rankings cached on disk
fundeli5.jev.url=https://api.typesafe.ai
fundeli5.jev.api-key=${TYPESAFE_API_KEY:}
fundeli5.jev.model=jev-latest
fundeli5.jev.cache-dir=target/jev-rankings
fundeli5.pipeline.page-budget=25
